name: Build & Release Windows EXE

on:
  push:
    branches:
      - release
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Pre-fetch PP-OCRv5 mobile models for bundling
        run: |
          python -c "from rapidocr import LangDet, LangRec, ModelType, OCRVersion, RapidOCR; RapidOCR(params={'Det.ocr_version': OCRVersion.PPOCRV5, 'Det.lang_type': LangDet.CH, 'Det.model_type': ModelType.MOBILE, 'Rec.ocr_version': OCRVersion.PPOCRV5, 'Rec.lang_type': LangRec.LATIN, 'Rec.model_type': ModelType.MOBILE, 'Global.use_cls': False})"

      - name: Build standalone VHGameTranslator.exe
        run: python build_exe.py

      - name: Prepare Release Notes
        shell: pwsh
        run: |
          $tag = "v1.1.0"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ github.event.inputs.tag }}") {
            $tag = "${{ github.event.inputs.tag }}"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @'
          ## VH Translator v1.1.0 — Bản phát hành Windows (64-bit)

          Ứng dụng dịch màn hình game thời gian thực kiểu **WindowTranslator** dành cho Windows 10/11 (*made by Hưng*).

          ### Hướng dẫn tải & sử dụng
          1. Tải file **`VHGameTranslator.exe`** ở mục **Assets** bên dưới.
          2. Đặt vào một thư mục riêng và mở trực tiếp (đã tích hợp sẵn Python, Visual C++ runtime và model đa font `PP-OCRv5`, không cần cài Python).
          3. Đặt game ở chế độ **Borderless Windowed** hoặc **Windowed**, chọn cửa sổ game hoặc khoanh vùng phụ đề rồi bấm **Bắt đầu dịch** (`Alt + T`).

          ### Cải tiến nổi bật bản v1.1.0
          - **Chia 2 luồng dịch (Tiered Routing)**: nút bấm 1–4 từ chạy thẳng luồng HTTP/2 nhanh (~45 ms), hội thoại dài đẩy lên AI.
          - **SSE Streaming & Prompt gọn (< 75 token)**: đổ chữ trực tiếp lên lớp phủ cho cả Gemini và OpenAI/Groq/Cerebras/Ollama; sửa lỗi cắt cụt câu trên Gemini.
          - **Cache 2 tầng với `rapidfuzz`**: tầng 1 hash (~0.01 ms) + tầng 2 so mờ C++ (≥ 93%, ~0.3 ms) bắt lỗi OCR lệch 1–2 ký tự.
          - **Mặt nạ chữ chống nền 3D động (`< 0.2 ms`)**: loại bỏ hầu hết lượt OCR thừa khi sóng, mây, ánh sáng chuyển động phía sau phụ đề.
          - **Pipeline Drop-Oldest 1 phần tử + Trigger chữ chạy thông minh + Hủy ngang (Preemptive Cancel)** + hiển thị đo độ trễ 4 khâu trực tiếp.
          '@ | Set-Content -Path release_notes.md -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: VH Translator ${{ env.RELEASE_TAG }}
          body_path: release_notes.md
          files: dist/VHGameTranslator.exe
          draft: false
          prerelease: false
